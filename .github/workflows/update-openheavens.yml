name: Update Open Heavens Daily

on:
  schedule:
    - cron: '30 0 * * *'   # Every day at 00:30 UTC (1:30 AM WAT)
  workflow_dispatch:        # Allows you to run it manually anytime

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Update Open Heavens content
        run: python .github/scripts/update_openheavens.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add antenna-openheavens.html
          if git diff --staged --quiet; then
            echo "No changes detected"
          else
            git commit -m "Daily Open Heavens update - $(date -u +%Y-%m-%d)"
            git push
          fi
